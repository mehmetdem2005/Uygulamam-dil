services:
  - type: web
    name: uygulamam-dil-api
    runtime: docker
    repo: https://github.com/mehmetdem2005/Uygulamam-dil
    branch: agent/phase-03-format-designer
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: DEVELOPMENT_API_TOKEN
        generateValue: true
      - key: PREVIEW_TOKEN_SECRET
        generateValue: true
      - key: JOB_DATA_DIR
        value: /tmp/uygulamam-dil
      - key: PREVIEW_DAILY_JOB_LIMIT
        value: "25"
      - key: LLM_MAX_ATTEMPTS
        value: "3"
      - key: LLM_TIMEOUT_SECONDS
        value: "120"
      - key: LLM_MAX_TOTAL_TOKENS_PER_JOB
        value: "250000"
      - key: LLM_MAX_COST_MICRO_USD_PER_JOB
        value: "5000000"
      - key: DEEPSEEK_INPUT_MICRO_USD_PER_MILLION_TOKENS
        sync: false
      - key: DEEPSEEK_OUTPUT_MICRO_USD_PER_MILLION_TOKENS
        sync: false
      - key: EDGE_TTS_BASE_URL
        value: https://uygulamam-dil-edge-tts.onrender.com
      - key: EDGE_TTS_INTERNAL_TOKEN
        fromService:
          type: web
          name: uygulamam-dil-edge-tts
          envVarKey: EDGE_TTS_INTERNAL_TOKEN
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: uygulamam-dil-edge-tts
    runtime: docker
    repo: https://github.com/mehmetdem2005/Uygulamam-dil
    branch: agent/phase-03-format-designer
    plan: free
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    dockerfilePath: ./services/edge-tts/Dockerfile
    dockerContext: ./services/edge-tts
    envVars:
      - key: EDGE_TTS_INTERNAL_TOKEN
        generateValue: true
