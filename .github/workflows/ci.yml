name: Build and verify

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-tests:
    name: Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test domain and backend
        run: ./gradlew --no-daemon :android:core:model:test :android:core:data:test :backend:application:test :backend:infrastructure:source:test :backend:api:build

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble APK
        run: ./gradlew --no-daemon :android:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: uygulamam-dil-phase03-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  edge-tts-tests:
    name: Edge TTS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/edge-tts/requirements-dev.txt
      - name: Install service dependencies
        run: python -m pip install -r services/edge-tts/requirements-dev.txt
      - name: Run service tests
        working-directory: services/edge-tts
        run: python -m pytest -q

  publish-preview-apk:
    name: Publish preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/phase-03-format-designer'
    needs: [kotlin-tests, android-apk, edge-tts-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: phase-03-preview
      APK_NAME: UygulamamDil-phase03-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uygulamam-dil-phase03-debug-apk
          path: release
      - name: Prepare APK and checksum
        run: |
          mv release/app-debug.apk "release/${APK_NAME}"
          sha256sum "release/${APK_NAME}" > "release/${APK_NAME}.sha256"
      - name: Create or update prerelease
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Uygulamam Dil — Faz 03 Önizleme" \
              --notes "Responsive arayüz, kaynak alımı ve sürümlü format tasarımcısı içeren doğrulanmış debug APK." \
              --prerelease
          fi
          gh release upload "${RELEASE_TAG}" \
            "release/${APK_NAME}" \
            "release/${APK_NAME}.sha256" \
            --clobber
