name: Build and verify

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-tests:
    name: Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test domain and backend
        run: ./gradlew --no-daemon :android:core:model:test :backend:application:test :backend:api:build

  android-apk:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble APK
        run: ./gradlew --no-daemon :android:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: uygulamam-dil-phase01-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  edge-tts-tests:
    name: Edge TTS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/edge-tts/requirements-dev.txt
      - name: Install service dependencies
        run: python -m pip install -r services/edge-tts/requirements-dev.txt
      - name: Run service tests
        working-directory: services/edge-tts
        run: python -m pytest -q
